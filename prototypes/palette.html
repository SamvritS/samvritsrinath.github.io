<!doctype html>
<html lang="en" data-theme="light" data-variant="1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Network Observatory palette prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    transition: background-color 160ms ease, color 160ms ease;
  }
  h1, h2, h3, p, dl, dd, dt { margin: 0; }
  a { color: inherit; }
  button { font: inherit; }
  img { max-width: 100%; display: block; }
  :focus-visible { outline: 2px solid var(--wavelength); outline-offset: 2px; }

  [data-theme="light"][data-variant="1"] {
    --void: #f4ecdf;
    --surface: #fdf9f1;
    --surface-2: #f7efe2;
    --ink: #0f1722;
    --ink-soft: #3f4b5a;
    --ink-faint: #4b5766;
    --line: rgba(15, 23, 34, 0.10);
    --line-strong: rgba(15, 23, 34, 0.18);
    --wavelength: #b00f24;
    --field-blue: #3f7aa8;
    --field-teal: #18786f;
    --field-warm: #d08a2f;
    --field-slate: #7f8ea8;
    --stat-accent: var(--ink);
    --live-accent: var(--ink-faint);
    --sound-accent: var(--wavelength);
  }
  [data-theme="dark"][data-variant="1"] {
    --void: #040a12;
    --surface: #08111d;
    --surface-2: #0b1623;
    --ink: #f5f8fc;
    --ink-soft: #b0bccb;
    --ink-faint: #8c98aa;
    --line: rgba(245, 248, 252, 0.09);
    --line-strong: rgba(245, 248, 252, 0.18);
    --wavelength: #ff4638;
    --field-blue: #16446b;
    --field-teal: #0d4a44;
    --field-warm: #d89a3f;
    --field-slate: #2b3a4f;
    --stat-accent: var(--ink);
    --live-accent: var(--ink-faint);
    --sound-accent: var(--wavelength);
  }
  [data-theme="light"][data-variant="2"] {
    --void: #f4ecdf;
    --surface: #fdf9f1;
    --surface-2: #f7efe2;
    --ink: #0f1722;
    --ink-soft: #3f4b5a;
    --ink-faint: #4b5766;
    --line: rgba(15, 23, 34, 0.10);
    --line-strong: rgba(15, 23, 34, 0.18);
    --wavelength: #b00f24;
    --signal: #08706a;
    --signal-soft: rgba(8, 112, 106, 0.12);
    --signal-glow: rgba(8, 112, 106, 0.28);
    --field-blue: #3f7aa8;
    --field-teal: #18786f;
    --field-warm: #d08a2f;
    --field-slate: #7f8ea8;
    --stat-accent: var(--signal);
    --live-accent: var(--signal);
    --sound-accent: var(--wavelength);
  }
  [data-theme="dark"][data-variant="2"] {
    --void: #040a12;
    --surface: #08111d;
    --surface-2: #0b1623;
    --ink: #f5f8fc;
    --ink-soft: #b0bccb;
    --ink-faint: #8c98aa;
    --line: rgba(245, 248, 252, 0.09);
    --line-strong: rgba(245, 248, 252, 0.18);
    --wavelength: #ff4638;
    --signal: #5fe0d4;
    --signal-soft: rgba(95, 224, 212, 0.12);
    --signal-glow: rgba(95, 224, 212, 0.28);
    --field-blue: #16446b;
    --field-teal: #0d4a44;
    --field-warm: #d89a3f;
    --field-slate: #2b3a4f;
    --stat-accent: var(--signal);
    --live-accent: var(--signal);
    --sound-accent: var(--wavelength);
  }
  [data-theme="light"][data-variant="3"] {
    --void: #f4ecdf;
    --surface: #fdf9f1;
    --surface-2: #f7efe2;
    --ink: #0f1722;
    --ink-soft: #3f4b5a;
    --ink-faint: #4b5766;
    --line: rgba(15, 23, 34, 0.10);
    --line-strong: rgba(15, 23, 34, 0.18);
    --wavelength: #b00f24;
    --signal: #08706a;
    --signal-soft: rgba(8, 112, 106, 0.12);
    --signal-glow: rgba(8, 112, 106, 0.28);
    --starlight: #8a620f;
    --starlight-bright: #c9973e;
    --starlight-soft: rgba(138, 98, 15, 0.12);
    --starlight-glow: rgba(201, 151, 62, 0.28);
    --field-blue: #3f7aa8;
    --field-teal: #18786f;
    --field-warm: #d08a2f;
    --field-slate: #7f8ea8;
    --stat-accent: var(--signal);
    --live-accent: var(--signal);
    --sound-accent: var(--starlight);
  }
  [data-theme="dark"][data-variant="3"] {
    --void: #040a12;
    --surface: #08111d;
    --surface-2: #0b1623;
    --ink: #f5f8fc;
    --ink-soft: #b0bccb;
    --ink-faint: #8c98aa;
    --line: rgba(245, 248, 252, 0.09);
    --line-strong: rgba(245, 248, 252, 0.18);
    --wavelength: #ff4638;
    --signal: #5fe0d4;
    --signal-soft: rgba(95, 224, 212, 0.12);
    --signal-glow: rgba(95, 224, 212, 0.28);
    --starlight: #e8b96a;
    --starlight-bright: #ffd88a;
    --starlight-soft: rgba(232, 185, 106, 0.12);
    --starlight-glow: rgba(255, 216, 138, 0.28);
    --field-blue: #16446b;
    --field-teal: #0d4a44;
    --field-warm: #d89a3f;
    --field-slate: #2b3a4f;
    --stat-accent: var(--signal);
    --live-accent: var(--signal);
    --sound-accent: var(--starlight);
  }

  :root {
    --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --hue: #14b8a6;
    --hue-field: color-mix(in srgb, var(--hue) 7%, var(--void));
    --hue-line: color-mix(in srgb, var(--hue) 45%, var(--line));
    --hue-text-weight: 50%;
  }
  [data-theme="dark"] { --hue-text-weight: 65%; }

  .proto-meta {
    background: #111;
    color: #f5f5f5;
  }
  .proto-meta-inner {
    max-width: 1152px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .proto-kicker {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9a9a9a;
  }
  .proto-title {
    margin-top: 4px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .proto-sub {
    margin-top: 2px;
    font-size: 13px;
    color: #b9b9b9;
  }
  .proto-theme {
    flex: 0 0 auto;
    min-height: 40px;
    padding: 0 14px;
    border: 1px solid #444;
    border-radius: 999px;
    background: #1d1d1d;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .proto-theme:hover { border-color: #777; }
  .proto-theme:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .page {
    max-width: 1152px;
    margin: 0 auto;
    padding: 0 24px 96px;
  }
  .site-nav {
    max-width: 720px;
    margin: 24px auto 0;
    min-height: 56px;
    border: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 14px 0 20px;
  }
  .nav-left, .nav-right, .nav-links, .icons { display: flex; align-items: center; }
  .nav-left { gap: 12px; }
  .brand {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--ink);
  }
  .icons { gap: 4px; }
  .icon {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
  }
  .icon svg { width: 17px; height: 17px; }
  .nav-links { gap: 18px; }
  .nav-link {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .nav-link.is-active { color: var(--ink); }
  .nav-menu {
    display: none;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .resume-btn {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
  }

  .hero-sample {
    display: grid;
    grid-template-columns: 5fr 7fr;
    gap: 48px;
    align-items: center;
    padding: 72px 0 56px;
    border-bottom: 1px solid var(--line);
  }
  .hero-copy { position: relative; z-index: 1; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .hero-copy h1 {
    margin-top: 22px;
    font-size: clamp(2.8rem, 6vw, 5.2rem);
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  .hero-current {
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .hero-current strong { color: var(--ink); font-weight: 500; }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 12px;
    margin-left: 4px;
    background: var(--wavelength);
    vertical-align: -1px;
  }
  .hero-support {
    margin-top: 22px;
    max-width: 28rem;
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink);
  }
  .hero-proof {
    margin-top: 13px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    margin-top: 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 20px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .btn-primary { background: var(--ink); color: var(--void); }
  .btn-primary:hover { background: var(--wavelength); border-color: var(--wavelength); color: var(--void); }
  .btn-secondary { border-color: var(--line-strong); }
  .btn-secondary:hover { border-color: var(--wavelength); }
  .btn-signal { background: var(--signal); border-color: var(--signal); color: var(--void); }
  .btn-signal:hover { border-color: var(--wavelength); }
  .btn-starlight { background: var(--starlight); border-color: var(--starlight); color: var(--void); }
  .btn-starlight:hover { border-color: var(--wavelength); }
  .text-link {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 2px;
  }
  .text-link:hover { color: var(--wavelength); }

  .hero-instrument { position: relative; min-height: 480px; }
  .hero-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 74% 26%, color-mix(in srgb, var(--field-blue) 28%, transparent), transparent 56%),
      radial-gradient(circle at 94% 78%, color-mix(in srgb, var(--field-warm) 18%, transparent), transparent 54%),
      radial-gradient(circle at 18% 88%, color-mix(in srgb, var(--field-teal) 15%, transparent), transparent 50%);
  }
  .portrait-wrap {
    position: absolute;
    left: 50%;
    top: 46%;
    width: clamp(190px, 28vw, 290px);
    transform: translate(-50%, -50%);
  }
  .portrait-wrap img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line-strong);
  }
  .portrait-caption {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }
  .node {
    position: absolute;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 4px 6px;
    font-family: var(--font-mono);
    line-height: 1.25;
  }
  .node-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 5px;
    border: 1px solid var(--ink-faint);
    border-radius: 50%;
    vertical-align: 1px;
  }
  .node-name {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .node-value {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 600;
    color: var(--stat-accent);
  }
  .node-metric {
    display: block;
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .node-a { left: 0; bottom: 10%; }
  .node-b { right: 0; top: 12%; }
  .node-c { left: 2%; top: 38%; }
  .node-d { right: 0; bottom: 7%; }

  .page-header {
    border-top: 1px solid var(--line);
    padding: 20px 0 48px;
  }
  .page-meta {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .meta-rule {
    display: inline-block;
    width: 24px;
    height: 1px;
    margin: 0 6px;
    background: currentColor;
    vertical-align: middle;
  }
  .page-title-grid {
    display: grid;
    grid-template-columns: 3fr 9fr;
    gap: 48px;
    margin-top: 36px;
  }
  .page-title h2 {
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.04em;
  }
  .page-title p { margin-top: 16px; }
  .read {
    max-width: 68ch;
    font-size: 17px;
    line-height: 1.7;
    color: var(--ink-soft);
  }

  .section {
    border-top: 1px solid var(--line);
    padding: 56px 0;
  }
  .section-grid {
    display: grid;
    grid-template-columns: 3fr 9fr;
    gap: 48px;
  }
  .section-grid > * { min-width: 0; }
  .section-rail { position: sticky; top: 24px; align-self: start; }
  .register {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 72px;
    margin-top: 22px;
  }
  .register span {
    display: block;
    height: 1px;
    background: var(--line-strong);
  }
  .register span:nth-child(3) { background: var(--wavelength); }
  .section-main h2 {
    font-size: clamp(1.9rem, 4vw, 3rem);
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.035em;
  }
  .section-main > .read { margin-top: 16px; }

  .experience-row {
    display: grid;
    grid-template-columns: 170px minmax(0, 1fr);
    gap: 24px;
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .date {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-left: 1px solid var(--line);
    padding-left: 12px;
  }
  .experience-row h3 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
  .company, .tech {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .tech { color: var(--ink-faint); }

  .project-lead { margin-top: 8px; }
  .project-cover {
    width: 100%;
    aspect-ratio: 5834 / 1675;
    object-fit: cover;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .project-grid {
    display: grid;
    grid-template-columns: 7fr 5fr;
    gap: 40px;
    margin-top: 28px;
  }
  .hue-sample {
    display: inline-block;
    padding: 4px 7px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .hue-field { background: var(--hue-field); }
  .hue-text { color: color-mix(in srgb, var(--hue) var(--hue-text-weight), var(--ink)); }
  .project-title {
    margin-top: 14px;
    font-size: clamp(1.8rem, 3.4vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.035em;
  }
  .project-grid .read { margin-top: 14px; }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 22px;
  }
  .meta-grid dt {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .meta-grid dd { margin-top: 3px; font-size: 13px; color: var(--ink); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 20px; align-content: start; }
  .stat-value { display: block; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
  .stat-label {
    display: block;
    margin-top: 3px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .ledger {
    margin-top: 36px;
    border-top: 1px solid var(--line);
  }
  .ledger-row {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 24px;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
  }
  .ledger-row img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .ledger-row h3 { font-size: 18px; font-weight: 500; }
  .ledger-row p { margin-top: 4px; font-size: 13px; color: var(--ink-soft); }
  .ledger-metric {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    display: inline-flex;
    border: 1px solid var(--line);
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .faq { margin-top: 28px; border-top: 1px solid var(--line); }
  .faq-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 0;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .faq-sign { font-family: var(--font-mono); color: var(--ink-faint); }
  .faq-answer { padding: 0 0 18px; border-bottom: 1px solid var(--line); }

  .accent-grid {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 32px;
    align-items: start;
    margin-top: 24px;
  }
  .accent-note { margin-top: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
  .accent-panel {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 20px;
  }
  .accent-panel h3 { font-size: 18px; font-weight: 500; }
  .accent-panel .read { margin-top: 8px; font-size: 15px; }
  .accent-sample-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }
  .focus-sample {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 16px;
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-size: 13px;
    outline: 2px solid var(--wavelength);
    outline-offset: 2px;
  }

  function hexToRgb(hex) {
    const value = hex.replace("#", "");
    return [
      parseInt(value.slice(0, 2), 16),

  function renderContrast() {
    const wrap = document.getElementById("contrast-table");
    if (!wrap) return;
    const stageInner = document.querySelector(".stage-inner");
    const accent = stageInner?.dataset.accent || "warm";
    const voidColor = readToken("--void");
    const surface = readToken("--surface");
    const ink = readToken("--ink");
    const soft = readToken("--ink-soft");
    const faint = readToken("--ink-faint");
    const wavelength = readToken("--wavelength");
    const signal = readToken("--signal");
    const starlight = readToken("--starlight");
    const hueField = mixHex(readToken("--hue"), voidColor, 0.07);
    const hueWeight = document.documentElement.dataset.theme === "dark" ? 0.65 : 0.5;
    const hueText = mixHex(readToken("--hue"), ink, hueWeight);

    const rows = [
      ["ink on void", ink, voidColor],
      ["ink on surface", ink, surface],
      ["ink-soft on void", soft, voidColor],
      ["ink-soft on surface", soft, surface],
      ["ink-faint on void", faint, voidColor],
      ["ink-faint on surface", faint, surface],
      ["wavelength on void", wavelength, voidColor],
      ["wavelength on surface", wavelength, surface],
      ["void on wavelength", voidColor, wavelength],
      ["project hue text on void", hueText, voidColor],
      ["project hue text on hue field", hueText, hueField],
    ];

    if (accent !== "warm") {
      rows.push(
        ["signal on void", signal, voidColor],
        ["signal on surface", signal, surface],
        ["void on signal", voidColor, signal],
      );
    }
    if (accent === "starlight") {
      rows.push(
        ["starlight on void", starlight, voidColor],
        ["starlight on surface", starlight, surface],
        ["void on starlight", voidColor, starlight],
      );
    }

    const rowsHTML = rows
      .map(([label, foreground, background]) => {
        const ratio = contrast(foreground, background);
        const pass = ratio >= 4.5;
        return `
          <tr>
            <td>
              <span class="swatches" aria-hidden="true">
                <span class="swatch" style="background:${foreground}"></span>
                <span class="swatch" style="background:${background}"></span>
              </span>
              ${label}
            </td>
            <td class="ratio">${ratio.toFixed(2)}:1</td>
            <td><span class="pass ${pass ? "" : "fail"}">${pass ? "Pass" : "Fail"}</span></td>
          </tr>
        `;
      })
      .join("");
    const allPass = rows.every(([, foreground, background]) => contrast(foreground, background) >= 4.5);

    wrap.innerHTML = `
      <table class="contrast-table">
        <caption>WCAG AA normal text requires 4.5:1. ${allPass ? "All pairs below pass." : "Some pairs fail; revise before shipping."}</caption>
        <thead>
          <tr><th scope="col">Text on field</th><th scope="col">Ratio</th><th scope="col">AA</th></tr>
        </thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    `;
  }

  function wireStage() {
    document.querySelectorAll(".faq-row").forEach((button) => {
      button.addEventListener("click", () => {
        const answer = document.getElementById(button.getAttribute("aria-controls"));
        const open = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!open));
        if (answer) answer.hidden = open;
        const sign = button.querySelector(".faq-sign");
        if (sign) sign.textContent = open ? "+" : "-";
      });
    });

    document.querySelectorAll(".sound-toggle").forEach((button) => {
      button.addEventListener("click", () => {
        const on = button.getAttribute("aria-pressed") === "true";
        button.setAttribute("aria-pressed", String(!on));
        button.textContent = on ? "Sound off" : "Sound on";
      });
    });

    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(button.dataset.copy);
        } catch {}
        const previous = button.textContent;
        button.textContent = "COPIED";
        setTimeout(() => {
          button.textContent = previous;
        }, 1500);
      });
    });

    renderContrast();
  }

  function moveHighlight() {
    const element = items[current];
    highlight.style.width = element.offsetWidth + "px";
    highlight.style.transform = "translateX(" + element.offsetLeft + "px)";
  }

  function mount(index) {
    stage.innerHTML = "";
    requestAnimationFrame(() => {
      stage.innerHTML = variants[index]();
      wireStage();
    });
  }

  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeBtn.textContent = theme === "light" ? "Dark" : "Light";
    themeBtn.setAttribute(
      "aria-label",
      theme === "light" ? "Switch to dark theme" : "Switch to light theme",
    );
    const url = new URL(location);
    url.searchParams.set("theme", theme);
    history.replaceState(null, "", url);
    renderContrast();
  }

  function setActive(index) {
    if (index < 0 || index >= variants.length) return;
    current = index;
    document.documentElement.dataset.variant = String(index + 1);
    items.forEach((element, itemIndex) => {
      element.toggleAttribute("data-active", itemIndex === index);
      if (itemIndex === index) element.setAttribute("aria-current", "true");
      else element.removeAttribute("aria-current");
    });
    document.getElementById("proto-title").textContent = variantsMeta[index].title;
    document.getElementById("proto-sub").textContent = variantsMeta[index].sub;
    moveHighlight();
    const url = new URL(location);
    url.searchParams.set("v", index + 1);
    history.replaceState(null, "", url);
    mount(index);
  }

  const variants = [
    () => baseHTML({ accent: "warm", accentSection: warmAccent() }),
    () => baseHTML({ accent: "signal", accentSection: signalAccent() }),
    () => baseHTML({ accent: "starlight", accentSection: starlightAccent() }),
  ];

  items.forEach((element, index) => {
    element.addEventListener("click", () => setActive(index));
  });

  themeBtn.addEventListener("click", () => {
    setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
  });

  window.addEventListener("resize", moveHighlight);

  document.addEventListener("keydown", (event) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const number = parseInt(event.key, 10);
    if (number >= 1 && number <= variants.length) setActive(number - 1);
    else if (event.key === "ArrowRight") setActive((current + 1) % variants.length);
    else if (event.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  });

  const params = new URLSearchParams(location.search);
  const initialTheme = params.get("theme") === "dark" ? "dark" : "light";
  document.documentElement.dataset.theme = initialTheme;
  themeBtn.textContent = initialTheme === "light" ? "Dark" : "Light";
  themeBtn.setAttribute(
    "aria-label",
    initialTheme === "light" ? "Switch to dark theme" : "Switch to light theme",
  );
  setActive((parseInt(params.get("v"), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
